services:
  rag-api:
    build: .
    container_name: rag-ai-assistant

    ports:
      - "8000:8000"

    volumes:
      - ./db:/app/db
      - ./data:/app/data

    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434

    extra_hosts:
      - "host.docker.internal:host-gateway"